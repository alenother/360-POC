<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIA Voice Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; height: 100vh; overflow: hidden; }
    #call-frame { width: 100%; height: 100vh; border: none; }
    #banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: linear-gradient(135deg, #0066CC, #00AAFF);
      color: #fff; text-align: center; padding: 10px 16px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px; font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div id="banner"></div>
  <div id="call-frame"></div>

  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roomUrl = params.get('room');
    const token = params.get('token');
    const banner = document.getElementById('banner');

    let detectedScenarioId = null;

    if (!roomUrl) {
      document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:40vh;font-family:sans-serif;">Missing room URL. Start bot.py first.</p>';
    } else {
      // Create Daily's prebuilt iframe UI (same as opening the room URL directly)
      const callFrame = window.DailyIframe.createFrame(
        document.getElementById('call-frame'),
        {
          iframeStyle: {
            width: '100%',
            height: '100vh',
            border: 'none',
          },
          showLeaveButton: true,
          showFullscreenButton: true,
        }
      );

      // Listen for app messages from bot (scenario detection)
      callFrame.on('app-message', (evt) => {
        console.log('Bot message:', evt.data);
        const data = evt.data;
        if (data.type === 'scenario_detected') {
          detectedScenarioId = data.scenario_id;
          banner.style.display = 'block';
          banner.textContent = 'Scenario detected: ' + data.scenario_name;
        }
        if (data.type === 'quote_ready') {
          detectedScenarioId = data.scenario_id;
          banner.style.display = 'block';
          banner.textContent = 'Your personalised quote is ready!';
        }
      });

      // When user leaves the call, redirect back to main page
      callFrame.on('left-meeting', () => {
        if (detectedScenarioId) {
          const base = window.location.origin + window.location.pathname.replace('call.html', '');
          window.location.href = base + '?s=' + detectedScenarioId;
        } else {
          const base = window.location.origin + window.location.pathname.replace('call.html', '');
          window.location.href = base;
        }
      });

      // Join the room
      const joinParams = { url: roomUrl };
      if (token) joinParams.token = token;
      callFrame.join(joinParams);
    }
  </script>
</body>
</html>
